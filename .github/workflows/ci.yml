name: CI

# For a description, see README_WORKFLOWS.md in this folder

on:
  schedule:
    - cron: '30 1 * * MON'
  workflow_dispatch:
  push:
    branches:
    - develop
    - 'feat-*'
  pull_request:

permissions:
  contents: read

env:
  QT_VERSION: '6.11.1' # quotes required or YAML parser will interpret as float

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      version_number: ${{ steps.create-version.outputs.version_number }}

    # The version number is YYYY.MM.DD.hhmm to create simple, easy-to-read "rolling release" versioning
    # PR artifacts also record their exact source revision and run ID.
    steps:
      - name: create version number
        id: create-version
        run: |
          echo "version_number=$(date +%Y.%-m.%-d.%-H%M)" >> $GITHUB_OUTPUT

  linux-test:
    if: github.event_name == 'pull_request'
    name: 'Linux: Run unit tests'
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: qtmultimedia

      - name: install build dependencies
        run: |
          sudo apt update && sudo apt install -y libxerces-c-dev

      - name: build Seamly2D & SeamlyMe for tests
        run: |
          qmake Seamly2D.pro
          make -j$(nproc)

      - name: install test dependencies
        # xvfb use to test built application within a framebuffer
        run: |
          sudo apt update
          sudo apt install -y xvfb gstreamer1.0-plugins-base libgstreamer-plugins-base1.0-0

      - name: run Seamly2D tests
        run: |
          xvfb-run -a make check

  linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'weblate'
    name: 'Linux: Build AppImage'
    runs-on: ubuntu-22.04
    needs: version
    env:
      VERSION_NUMBER: ${{ needs.version.outputs.version_number }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install appimage dependencies
        run: |
          sudo apt update && sudo apt install -y libfuse2
          sudo wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O /usr/local/bin/linuxdeploy-x86_64.AppImage
          sudo chmod +x /usr/local/bin/linuxdeploy-x86_64.AppImage
          sudo wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O /usr/local/bin/linuxdeploy-plugin-qt-x86_64.AppImage
          sudo chmod +x /usr/local/bin/linuxdeploy-plugin-qt-x86_64.AppImage

      - name: install build dependencies
        run: |
          sudo apt update
          # install poppler-utils for pdftops, gstreamer1.0-plugins-base for QtMultimedia
          # install libxerces for xml manipulation
          sudo apt install -y poppler-utils gstreamer1.0-plugins-base libxerces-c-dev

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: qtmultimedia

      - name: update version
        run: |
          ./scripts/version.sh ${VERSION_NUMBER}

      - name: build Seamly2D appimage
        env:
          OUTPUT: Seamly2D-x86_64.AppImage  # linuxdeploy-x86_64.AppImage uses this env var as name for AppImage
        run: |
          qmake -config release CONFIG+=noTests
          make -j$(nproc)
          make INSTALL_ROOT=`pwd`/AppDir install

          cp /usr/bin/pdftops AppDir/usr/bin
          mkdir -p AppDir/usr/share/X11/xkb
          cp -r /usr/share/X11/xkb/* AppDir/usr/share/X11/xkb
          linuxdeploy-x86_64.AppImage --appdir AppDir --desktop-file=dist/seamly2d.desktop --plugin qt --output appimage

      - uses: actions/upload-artifact@v7
        with:
          name: Seamly2D-x86_64.AppImage
          path: Seamly2D-x86_64.AppImage
          if-no-files-found: error


  macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'weblate'
    name: 'macOS: Build'
    runs-on: macos-26
    needs: version
    env:
      VERSION_NUMBER: ${{ needs.version.outputs.version_number }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install build dependencies
        run: |
          brew install xerces-c

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: qtmultimedia

      - name: update version
        run: |
          ./scripts/version.sh ${VERSION_NUMBER}

      - name: setup signing and notarization
        env:
          KEYCHAIN_FILE: ~/seamly2d.keychain
          APPLE_SIGN_IDENTITY: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref_name == 'develop' && secrets.apple_sign_identity || '' }}
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref_name == 'develop' && env.APPLE_SIGN_IDENTITY != '' }}
        run: |
          security create-keychain -p ${{ secrets.apple_keychain_password }} $KEYCHAIN_FILE
          security unlock-keychain -p ${{ secrets.apple_keychain_password }} $KEYCHAIN_FILE
          security set-keychain-settings $KEYCHAIN_FILE
          security list-keychains -d user -s $KEYCHAIN_FILE
          echo '${{ secrets.apple_sign_certificate }}' | base64 -d -o ~/seamly2d.p12
          security import ~/seamly2d.p12 -k $KEYCHAIN_FILE -T /usr/bin/codesign -P ${{ secrets.apple_sign_certificate_password }}
          security set-key-partition-list -S apple-tool:,apple: -s -k ${{ secrets.apple_keychain_password }} $KEYCHAIN_FILE
          echo "APPLE_SIGN_IDENTITY=${{ secrets.apple_sign_identity }}" >> $GITHUB_ENV

          mkdir -p ~/private_keys/
          echo '${{ secrets.apple_notarize_key_content }}' > ~/private_keys/AuthKey_${{ secrets.apple_notarize_key_id }}.p8
          echo "APPLE_NOTARIZE_KEY=~/private_keys/AuthKey_${{ secrets.apple_notarize_key_id }}.p8" >> $GITHUB_ENV
          echo "APPLE_NOTARIZE_KEY_ID=${{ secrets.apple_notarize_key_id }}" >> $GITHUB_ENV
          echo "APPLE_NOTARIZE_ISSUER_ID=${{ secrets.apple_notarize_issuer_id }}" >> $GITHUB_ENV

      - name: make Seamly2D for macos
        env:
          APPLE_SIGN_IDENTITY: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref_name == 'develop' && secrets.apple_sign_identity || '' }}
        run: |
          # see https://github.com/actions/runner-images/issues/7522
          echo killing XProtect...; sudo pkill -9 XProtect >/dev/null || true;
          # Publish and sign are limited to scheduled and manual runs on the develop branch.
          if [ -n "$APPLE_SIGN_IDENTITY" ] ; then
            qmake Seamly2D.pro -config release CONFIG+=noTests CONFIG+=macSign
          else
            qmake Seamly2D.pro -config release CONFIG+=noTests
          fi
          make -j$(sysctl -n hw.logicalcpu)

      - uses: actions/upload-artifact@v7
        with:
          name: Seamly2D-macos.zip
          path: out/Seamly2D-macos.zip
          if-no-files-found: error

  windows:
    if:  github.event_name != 'pull_request' || github.event.pull_request.user.login != 'weblate'
    name: 'Windows Build'
    runs-on: windows-2022
    needs: version
    env:
      VERSION_NUMBER: ${{ needs.version.outputs.version_number }}
    strategy:
      matrix:
        include:
          - msvc-arch: x64
            qt-arch: win64_msvc2022_64
            qmake: qmake
            release-file: Seamly2D-windows.zip
          - msvc-arch: amd64_arm64
            qt-arch: win64_msvc2022_arm64_cross_compiled
            qmake: host-qmake
            release-file: Seamly2D-win-arm64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: ${{ matrix.msvc-arch }}

      - name: Install Qt6 w/ qtmultimedia
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt-arch }}
          cache: true
          modules: qtmultimedia
          aqtsource: git+https://github.com/miurahr/aqtinstall.git  # TODO: Remove once aqtinstall 3.4.0 is released, see https://github.com/miurahr/aqtinstall/issues/1007

      - name: Update version
        shell: bash
        run: |
          ./scripts/version.sh ${VERSION_NUMBER}

      - name: qmake/make seamly2d.exe and seamlyme.exe
        run: |
          ${{ matrix.qmake }} Seamly2D.pro -config release CONFIG+=noTests
          nmake

      - name: install NSIS
        run: choco install nsis -y

      - name: create seamly2d-installer.exe
        # copy seamly2d and seamlyme directory trees prepared by windeployqt and create installer
        # uses parameters in seamly2d-installer.nsi to create the installer exe
        run: |
          mkdir windows-build
          Copy-Item -Path 'src\app\seamly2d\bin\*' -Destination windows-build -Recurse
          Copy-Item -Path 'src\app\seamlyme\bin\*' -Destination windows-build -Recurse -Force
          Copy-Item -Path dist\seamly2d-installer.nsi -Destination windows-build
          cd windows-build
          & 'C:\Program Files (x86)\NSIS\makensis.exe' seamly2d-installer.nsi

      - name: Authenticate to Google Cloud (for signing)
        uses: google-github-actions/auth@v3
        env:
          SEAMLY_SIGNING_PROJECT_ID: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref_name == 'develop' && secrets.SEAMLY_SIGNING_PROJECT_ID || '' }}
        # Publish and sign are limited to scheduled and manual runs on the develop branch.
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref_name == 'develop' && env.SEAMLY_SIGNING_PROJECT_ID != '' }}
        with:
          credentials_json: ${{ secrets.SEAMLY_SIGNING_SA_KEY }}
          project_id: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}

      - name: Setup Google Cloud CLI (for signing)
        uses: google-github-actions/setup-gcloud@v3
        env:
          SEAMLY_SIGNING_PROJECT_ID: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref_name == 'develop' && secrets.SEAMLY_SIGNING_PROJECT_ID || '' }}
        # Publish and sign are limited to scheduled and manual runs on the develop branch.
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref_name == 'develop' && env.SEAMLY_SIGNING_PROJECT_ID != '' }}

      - name: Set up Java (for signing)
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Sign executables
        env:
          SEAMLY_SIGNING_PROJECT_ID: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref_name == 'develop' && secrets.SEAMLY_SIGNING_PROJECT_ID || '' }}
        # Publish and sign are limited to scheduled and manual runs on the develop branch.
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref_name == 'develop' && env.SEAMLY_SIGNING_PROJECT_ID != '' }}
        shell: bash
        run: |
          java -jar .github/workflows/signing/jsign.jar \
          --storetype GOOGLECLOUD \
          --storepass "$(gcloud auth print-access-token)" \
          --keystore "projects/${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}/locations/${{ secrets.SEAMLY_SIGNING_LOCATION }}/keyRings/${{ secrets.SEAMLY_SIGNING_KEYRING_NAME }}" \
          --alias "${{ secrets.SEAMLY_SIGNING_KEY_NAME }}" \
          --certfile .github/workflows/signing/codesign-chain.pem \
          --tsaurl http://timestamp.sectigo.com \
          windows-build/Seamly2D-installer.exe

      - name: Print installer signature
        run: |
          Get-AuthenticodeSignature windows-build\Seamly2D-installer.exe

      - name: Include PR testing instructions and build details
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BUILD_ARCH: ${{ matrix.msvc-arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $builtSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          Copy-Item .github\workflows\PR_INTEGRATION_TESTING.md windows-build\TESTING.md
          Copy-Item src\app\share\samples windows-build\samples -Recurse
          @"
          UNSIGNED SEAMLY PR TEST BUILD — NOT A PRODUCTION RELEASE
          PR: #$env:PR_NUMBER
          PR head SHA: $env:PR_HEAD_SHA
          PR base SHA: $env:PR_BASE_SHA
          Built PR merge SHA: $builtSha
          Version: $env:VERSION_NUMBER
          Architecture: $env:BUILD_ARCH
          Workflow run: $runUrl
          Run attempt: $env:GITHUB_RUN_ATTEMPT
          Built UTC: $([DateTime]::UtcNow.ToString('o'))

          Test on a separate computer or VM using copies of sample files.
          The standard installer may replace an existing installation and share settings.
          Record these build details, OS/version, results, and screenshots in the PR.
          "@ | Set-Content windows-build\BUILD-INFO.txt -Encoding utf8
          $hash = (Get-FileHash windows-build\Seamly2D-installer.exe -Algorithm SHA256).Hash
          "$hash  Seamly2D-installer.exe" | Set-Content windows-build\SHA256SUMS.txt -Encoding ascii

      - name: pack installer file into .zip
        shell: pwsh
        env:
          BUILD_EVENT: ${{ github.event_name }}
          RELEASE_FILE: ${{ matrix.release-file }}
        run: |
          Set-Location windows-build
          $files = @('Seamly2D-installer.exe')
          if ($env:BUILD_EVENT -eq 'pull_request') {
            $files += @('TESTING.md', 'BUILD-INFO.txt', 'SHA256SUMS.txt', 'samples')
          }
          & 'C:\Program Files\7-Zip\7z.exe' a $env:RELEASE_FILE @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload windows artifacts
        id: upload-windows
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.release-file }}
          path: windows-build/${{ matrix.release-file }}
          if-no-files-found: error

      - name: Explain how to test the PR installer
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.upload-windows.outputs.artifact-url }}
          ARTIFACT_NAME: ${{ matrix.release-file }}
        run: |
          @"
          ## PR integration testing: $env:ARTIFACT_NAME
          [Download this unsigned Windows test build]($env:ARTIFACT_URL).
          GitHub sign-in and repository read access are required.
          Extract the artifact ZIP, then the installer ZIP inside it.
          Read BUILD-INFO.txt and TESTING.md; use a separate test computer or VM.
          Post results, build details, OS/version, and screenshots in the PR.
          A successful build does not mean human integration testing passed.
          "@ >> $env:GITHUB_STEP_SUMMARY

  publish:
    permissions:
      contents: write
    # Publish and sign are limited to scheduled and manual runs on the develop branch.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    needs: [version, linux, macos, windows]
    env:
      VERSION_NUMBER: ${{ needs.version.outputs.version_number }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Seamly2D-x86_64.AppImage
      - uses: actions/download-artifact@v8
        with:
          name: Seamly2D-macos.zip
      - uses: actions/download-artifact@v8
        with:
          name: Seamly2D-windows.zip
      - uses: actions/download-artifact@v8
        with:
          name: Seamly2D-win-arm64.zip
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION_NUMBER }}
          name: ${{ env.VERSION_NUMBER }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: false
          files: |
            Seamly2D-x86_64.AppImage
            Seamly2D-macos.zip
            Seamly2D-windows.zip
            Seamly2D-win-arm64.zip

  document:
    permissions:
      contents: write
    # Deploy Doxygen documentation for scheduled releases (schedule) and manual releases (workflow_dispatch) and pre-releases (push)
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest

    steps:
      - name: Doxygen GitHub Pages Deploy Action
        uses: DenverCoder1/doxygen-github-pages-action@a5ce84b4f3636592e0c101064b66136851c1605b
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          # folder where docs are built, must match OUTPUT_DIRECTORY in Doxyfile + html
          folder: docs/html
          config_file: Doxyfile
          # target_folder must match pages config in https://github.com/FashionFreedom/Seamly2D/settings/pages
          target_folder: docs/
