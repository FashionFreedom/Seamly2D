name: Create and Auto-Translate New Language

on:
  workflow_dispatch:
    inputs:
      lang_code:
        description: 'Target language code (e.g., pl_PL for Polish)'
        required: true
        default: 'pl_PL'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-and-translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install googletrans==4.0.0-rc1


      - name: Create new .ts files for language
        run: |
          python scripts/create_new_ts.py ${{ github.event.inputs.lang_code }}

      - name: Auto-translate new .ts files
        run: |
          python scripts/auto_translate_ts.py ${{ github.event.inputs.lang_code.split('_')[0] }} share/translations/measurements_${{ github.event.inputs.lang_code }}.ts share/translations/seamly2d_${{ github.event.inputs.lang_code }}.ts

      - name: Build Seamly2D with new translation
        run: |
          qmake Seamly2D.pro
          make -j$(nproc)

      - name: Set up Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create new branch and commit changes
        run: |
          BRANCH=auto/translation-${{ github.event.inputs.lang_code }}
          git checkout -b $BRANCH
          git add share/translations/measurements_${{ github.event.inputs.lang_code }}.ts
          git add share/translations/seamly2d_${{ github.event.inputs.lang_code }}.ts
          git add share/translations/measurements.pro
          git add share/translations/translations.pro
          git add src/app/translations.pri
          git add src/libs/vmisc/def.cpp
          git commit -m "Add and auto-translate ${{ github.event.inputs.lang_code }} translation files"
          git push --set-upstream origin $BRANCH

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/translation-${{ github.event.inputs.lang_code }}
          base: develop
          title: "Add and auto-translate ${{ github.event.inputs.lang_code }} translation files"
          body: "This PR was created automatically to add and auto-translate ${{ github.event.inputs.lang_code }} translation files."
          draft: true