name: Code Signing Workflow

on:
  # Run on schedule (daily at 2 AM UTC)
  schedule:
    - cron: '0 2 * * *'
  
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to sign (leave empty for latest)'
        required: false
        type: string
      artifact_name:
        description: 'Specific artifact name to sign (leave empty for all)'
        required: false
        type: string

jobs:
  # Manual approval job
  approval:
    runs-on: ubuntu-latest
    steps:
      - name: Request Approval
        run: |
          echo "Code signing workflow requires manual approval"
          echo "Commit SHA: ${{ github.event.inputs.commit_sha || github.sha }}"
          echo "Artifact: ${{ github.event.inputs.artifact_name || 'All artifacts' }}"
          echo "Please review and approve this workflow run."

  # Signing job (runs after approval)
  sign-artifacts:
    needs: approval
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}

      - name: Authenticate with Google Cloud
        run: |
          echo '${{ secrets.SEAMLY_SIGNING_SA_KEY }}' > /tmp/service-account-key.json
          gcloud auth activate-service-account --key-file=/tmp/service-account-key.json
          gcloud config set project ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}

      - name: Download signing tools
        run: |
          # Create signing directory
          mkdir -p .github/workflows/signing
          cd .github/workflows/signing
          
          # Download jsign.jar (you'll need to host this somewhere or include in repo)
          # For now, we'll assume it's in the repository
          echo "Using jsign.jar from repository"

      - name: Find Windows build artifacts
        id: find-artifacts
        run: |
          # Look for recent Windows build workflow runs
          echo "Looking for Windows build artifacts..."
          
          # Get the commit SHA to sign
          COMMIT_SHA="${{ github.event.inputs.commit_sha || github.sha }}"
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          
          # Find the most recent successful Windows build for this commit
          # This is a simplified approach - you might want to enhance this
          echo "artifact_name=${{ github.event.inputs.artifact_name || 'Seamly2D-installer.exe' }}" >> $GITHUB_OUTPUT

      - name: Download unsigned artifacts
        id: download-artifacts
        run: |
          # Create artifacts directory
          mkdir -p unsigned-artifacts
          cd unsigned-artifacts
          
          # Download artifacts from the most recent Windows build
          # This is a placeholder - you'll need to implement the actual download logic
          # based on your Windows build workflow structure
          
          echo "Downloading unsigned artifacts..."
          # Example: Download from a specific workflow run
          # gh run download --repo ${{ github.repository }} --name "Windows-Installer" --dir .
          
          echo "artifacts_dir=$(pwd)" >> $GITHUB_OUTPUT

      - name: Sign Windows executables
        run: |
          cd .github/workflows/signing
          
          # Set environment variables for signing
          export SEAMLY_SIGNING_PROJECT_ID="${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}"
          export SEAMLY_SIGNING_LOCATION="${{ secrets.SEAMLY_SIGNING_LOCATION }}"
          export SEAMLY_SIGNING_KEYRING_NAME="${{ secrets.SEAMLY_SIGNING_KEYRING_NAME }}"
          export SEAMLY_SIGNING_KEY_NAME="${{ secrets.SEAMLY_SIGNING_KEY_NAME }}"
          
          # Make script executable
          chmod +x sign-windows-executable.sh
          
          # Sign each executable found
          cd ../../unsigned-artifacts
          for exe in *.exe; do
            if [ -f "$exe" ]; then
              echo "Signing $exe..."
              ../.github/workflows/signing/sign-windows-executable.sh "$exe"
            fi
          done

      - name: Create signed artifacts archive
        id: create-archive
        run: |
          cd unsigned-artifacts
          
          # Create timestamp for the release
          TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
          COMMIT_SHORT="${{ steps.find-artifacts.outputs.commit_sha }}" | cut -c1-8
          
          # Create archive with signed artifacts
          tar -czf "../signed-artifacts-${COMMIT_SHORT}-${TIMESTAMP}.tar.gz" *.exe
          
          echo "archive_name=signed-artifacts-${COMMIT_SHORT}-${TIMESTAMP}.tar.gz" >> $GITHUB_OUTPUT

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows-installers
          path: |
            unsigned-artifacts/*.exe
            signed-artifacts-*.tar.gz
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Create a draft release with signed artifacts
          gh release create "v0.0.0-signed-${{ steps.find-artifacts.outputs.commit_sha }}" \
            --draft \
            --title "Signed Windows Installers - ${{ steps.find-artifacts.outputs.commit_sha }}" \
            --notes "Code-signed Windows installers for commit ${{ steps.find-artifacts.outputs.commit_sha }}"
          
          # Upload signed artifacts to the release
          gh release upload "v0.0.0-signed-${{ steps.find-artifacts.outputs.commit_sha }}" \
            unsigned-artifacts/*.exe

      - name: Log signing completion
        run: |
          echo "=== Code Signing Workflow Completed ==="
          echo "Commit SHA: ${{ steps.find-artifacts.outputs.commit_sha }}"
          echo "Signed artifacts:"
          ls -la unsigned-artifacts/*.exe
          echo "Archive: ${{ steps.create-archive.outputs.archive_name }}" 
