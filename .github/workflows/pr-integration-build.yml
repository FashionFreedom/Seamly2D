name: PR Integration Test Build

on:
  workflow_call:
    inputs:
      version_number:
        required: true
        type: string
      qt_version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-integration-build:
    name: 'Windows x64: Integration Test Build'
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'weblate'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VERSION_NUMBER: ${{ inputs.version_number }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      # Default checkout is GitHub's PR merge revision, also used by linux-test.
      # Do not switch this to pull_request_target or workflow_run.
      - name: Checkout PR merge revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Identify test build
        id: identity
        shell: pwsh
        run: |
          $builtSha = (git rev-parse HEAD).Trim()
          $shortHead = $env:PR_HEAD_SHA.Substring(0, 12)
          $artifactName = "Seamly2D-PR-$env:PR_NUMBER-$shortHead-windows-x64-run-$env:GITHUB_RUN_ID-attempt-$env:GITHUB_RUN_ATTEMPT"
          "BUILT_SHA=$builtSha" >> $env:GITHUB_ENV
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT

      - name: Setup MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: x64

      - name: Install Qt6 with qtmultimedia
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ inputs.qt_version }}
          arch: win64_msvc2022_64
          cache: false
          modules: qtmultimedia
          # Matches the existing Windows CI until its aqt ARM64 workaround is removed.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git

      - name: Update version
        shell: bash
        run: ./scripts/version.sh "$VERSION_NUMBER"

      - name: Build Seamly2D and SeamlyMe
        shell: pwsh
        run: |
          qmake Seamly2D.pro -config release CONFIG+=noTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create unsigned integration-test installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path windows-build | Out-Null
          Copy-Item -Path 'src\app\seamly2d\bin\*' -Destination windows-build -Recurse
          Copy-Item -Path 'src\app\seamlyme\bin\*' -Destination windows-build -Recurse -Force
          Copy-Item -Path 'dist\seamly2d-installer.nsi' -Destination windows-build
          Push-Location windows-build
          & 'C:\Program Files (x86)\NSIS\makensis.exe' seamly2d-installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          New-Item -ItemType Directory -Path integration-test | Out-Null
          Copy-Item windows-build\Seamly2D-installer.exe integration-test\Seamly2D-PR-test-installer.exe

      - name: Include sample files and build identification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item src\app\share\samples integration-test\samples -Recurse
          Copy-Item .github\workflows\PR_INTEGRATION_TESTING.md integration-test\TESTING.md
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          @"
          UNSIGNED SEAMLY PR INTEGRATION-TEST BUILD — NOT A PRODUCTION RELEASE
          PR: #$env:PR_NUMBER
          PR head SHA: $env:PR_HEAD_SHA
          PR base SHA: $env:PR_BASE_SHA
          Built PR merge SHA: $env:BUILT_SHA
          Version: $env:VERSION_NUMBER
          Workflow run: $runUrl
          Run attempt: $env:GITHUB_RUN_ATTEMPT
          Built UTC: $([DateTime]::UtcNow.ToString('o'))

          Use a disposable VM or separate test computer and copies of sample files.
          This uses the normal installer, which may replace an existing installation
          and share application settings. It is not a side-by-side test installer.
          Report the above revisions, OS/version, results, and screenshots in the PR.
          Any new commit or base update requires a new build and integration review.
          "@ | Set-Content integration-test\BUILD-INFO.txt -Encoding utf8
          $hash = (Get-FileHash integration-test\Seamly2D-PR-test-installer.exe -Algorithm SHA256).Hash
          "$hash  Seamly2D-PR-test-installer.exe" | Set-Content integration-test\SHA256SUMS.txt -Encoding ascii

      # upload-artifact supplies the downloadable ZIP; no nested ZIP is needed.
      - name: Upload integration-test artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: integration-test/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Explain how to download and test
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          @"
          ## Windows x64 PR integration-test build
          PR: #$env:PR_NUMBER  
          PR head SHA: $env:PR_HEAD_SHA  
          Built PR merge SHA: $env:BUILT_SHA  
          Version: $env:VERSION_NUMBER

          [Download the unsigned test artifact]($env:ARTIFACT_URL).
          GitHub sign-in and repository read access are required.
          Extract the ZIP and read BUILD-INFO.txt and TESTING.md.
          Test on a disposable VM or separate test computer; the standard installer
          can replace your current Seamly installation and reuse its settings.
          Post results and screenshots in the PR before approving it.
          Build success does not certify that human integration testing passed.
          "@ >> $env:GITHUB_STEP_SUMMARY
